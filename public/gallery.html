<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>作品广场 - SillyTavern</title>
    <link rel="icon" href="favicon.ico">
    <!-- SillyTavern style stack: the page follows the user's active theme -->
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/brands.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/gallery.css">
</head>
<body class="st-page">
    <header id="galleryHeader">
        <div class="logo"><i class="fa-solid fa-store"></i>作品广场</div>
        <div class="search-box">
            <input id="searchInput" class="text_pole" type="text" placeholder="搜索作品、作者、标签…">
            <button id="searchBtn" class="menu_button"><i class="fa-solid fa-magnifying-glass"></i> 搜索</button>
        </div>
        <div class="tab-strip" id="sortTabs">
            <div class="tab active" data-sort="new"><i class="fa-solid fa-clock"></i> 最新</div>
            <div class="tab" data-sort="hot"><i class="fa-solid fa-fire"></i> 热门</div>
            <div class="tab" data-sort="downloads"><i class="fa-solid fa-download"></i> 下载榜</div>
            <div class="tab" data-sort="mine"><i class="fa-solid fa-user"></i> 我的作品</div>
        </div>
        <div class="actions">
            <button class="menu_button primary" id="publishBtn"><i class="fa-solid fa-cloud-arrow-up"></i> 发布作品</button>
            <button class="menu_button" id="adminBtn" style="display:none"><i class="fa-solid fa-shield-halved"></i> 管理后台</button>
            <a class="menu_button" id="siteAdminLink" href="/admin.html" style="display:none"><i class="fa-solid fa-gear"></i> 站点管理</a>
            <a class="menu_button" href="/"><i class="fa-solid fa-arrow-left"></i> 返回聊天</a>
        </div>
    </header>

    <div id="adminBar">
        <div class="admin-stats" id="adminStats"></div>
        <div class="tab-strip" id="adminFilterTabs">
            <div class="tab active" data-adminfilter="all">全部作品</div>
            <div class="tab" data-adminfilter="reported"><i class="fa-solid fa-flag"></i> 待处理举报</div>
            <div class="tab" data-adminfilter="hidden"><i class="fa-solid fa-eye-slash"></i> 已隐藏</div>
            <div class="tab" data-adminfilter="unlisted"><i class="fa-solid fa-lock"></i> 不公开</div>
        </div>
    </div>

    <main id="galleryMain">
        <div id="grid"></div>
        <div id="empty" style="display:none"><i class="fa-solid fa-ghost" style="font-size:2em; margin-bottom:12px;"></i><br>这里还什么都没有～ 成为第一个分享作品的人吧！</div>
    </main>

    <!-- 详情弹窗 -->
    <div class="modal-mask" id="detailMask">
        <div class="modal">
            <span class="modal-close" data-close="detailMask"><i class="fa-solid fa-times"></i></span>
            <h2><i class="fa-solid fa-circle-info" style="color:var(--gal-accent); margin-right:6px;"></i>作品详情</h2>
            <div class="detail-top">
                <img class="cover" id="detailCover" alt="cover">
                <div class="detail-info">
                    <h2 id="detailTitle" style="margin:0"></h2>
                    <div class="tags" id="detailTags"></div>
                    <div class="versions" id="detailMeta"></div>
                    <div class="modal-actions" style="justify-content:flex-start; margin-top:auto;">
                        <button class="menu_button primary" id="claimBtn"><i class="fa-solid fa-cloud-arrow-down"></i> 领取到我的角色</button>
                        <button class="menu_button" id="likeBtn"><i class="fa-solid fa-heart"></i> 点赞</button>
                        <button class="menu_button" id="reportBtn"><i class="fa-solid fa-flag"></i> 举报</button>
                        <button class="menu_button" id="editBtn" style="display:none"><i class="fa-solid fa-pen"></i> 更新版本</button>
                        <button class="menu_button" id="hideBtn" style="display:none"><i class="fa-solid fa-eye-slash"></i> 隐藏</button>
                        <button class="menu_button btn-danger" id="deleteBtn" style="display:none"><i class="fa-solid fa-trash"></i> 删除</button>
                    </div>
                </div>
            </div>
            <h3>作品简介</h3>
            <div class="detail-desc" id="detailDesc"></div>
            <h3>版本历史</h3>
            <div class="versions" id="detailVersions"></div>
            <div id="detailReportsBlock" style="display:none">
                <h3 style="color:var(--gal-danger)"><i class="fa-solid fa-flag"></i> 举报记录</h3>
                <div class="report-list" id="detailReports"></div>
            </div>
        </div>
    </div>

    <!-- 发布向导弹窗 -->
    <div class="modal-mask" id="publishMask">
        <div class="modal wide">
            <span class="modal-close" data-close="publishMask"><i class="fa-solid fa-times"></i></span>
            <h2 id="publishHeading"><i class="fa-solid fa-cloud-arrow-up" style="color:var(--gal-accent); margin-right:6px;"></i>发布作品</h2>

            <div class="publish-layout">
                <div class="publish-form">
                    <div class="form-row" id="charPickerRow">
                        <label><i class="fa-solid fa-user-group"></i> 选择角色 <span class="counter" id="charCounter"></span></label>
                        <input type="text" id="charSearch" class="text_pole char-search" placeholder="搜索我的角色…">
                        <div class="char-list" id="charList"></div>
                        <div class="error-msg">请先选择一个要发布的角色</div>
                    </div>

                    <div class="form-row" id="titleRow">
                        <label><i class="fa-solid fa-heading"></i> 标题 <span class="counter" id="titleCounter">0 / 80</span></label>
                        <input type="text" id="pubTitle" class="text_pole" maxlength="80" placeholder="给作品起个响亮的名字">
                        <div class="error-msg">标题不能为空</div>
                    </div>

                    <div class="form-row">
                        <label><i class="fa-solid fa-align-left"></i> 简介 <span class="counter" id="descCounter">0 / 2000</span></label>
                        <textarea id="pubDesc" class="text_pole" placeholder="介绍一下这个角色：性格、适合的聊天风格、注意事项…"></textarea>
                        <div class="hint">写得越清楚，别人越愿意领取～</div>
                    </div>

                    <div class="form-row">
                        <label><i class="fa-solid fa-tags"></i> 标签 <span class="counter" id="tagCounter">0 / 10</span></label>
                        <div class="chips-input" id="chipsBox">
                            <input type="text" id="tagInput" placeholder="输入标签后回车添加">
                        </div>
                        <div class="tag-suggestions" id="tagSuggestions"></div>
                        <div class="hint">最多 10 个标签，方便大家搜索到你的作品</div>
                    </div>

                    <div class="form-row">
                        <label><i class="fa-solid fa-eye"></i> 可见性</label>
                        <div class="vis-cards" id="visCards">
                            <div class="vis-card selected" data-vis="public">
                                <i class="fa-solid fa-globe"></i>
                                <div>
                                    <div class="vis-title">公开发布</div>
                                    <div class="vis-desc">展示在作品广场，所有人都能看到并领取</div>
                                </div>
                            </div>
                            <div class="vis-card" data-vis="unlisted">
                                <i class="fa-solid fa-lock"></i>
                                <div>
                                    <div class="vis-title">仅自己可见</div>
                                    <div class="vis-desc">不展示在广场，只有你自己能看到</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row" id="noteRow">
                        <label><i class="fa-solid fa-pen-to-square"></i> 版本说明 <span class="counter" id="noteCounter">0 / 500</span></label>
                        <input type="text" id="pubNote" class="text_pole" maxlength="500" placeholder="这次更新了什么？（可选）">
                    </div>
                </div>

                <div class="publish-preview">
                    <div class="preview-label"><i class="fa-solid fa-eye"></i> 预览（别人看到的效果）</div>
                    <div class="preview-card">
                        <img class="cover" id="previewCover" alt="preview">
                        <div class="body">
                            <div class="title" id="previewTitle">未命名作品</div>
                            <div class="author" id="previewAuthor">by 你</div>
                            <div class="tags" id="previewTags"></div>
                            <div class="stats">
                                <span><i class="fa-solid fa-heart"></i> 0</span>
                                <span><i class="fa-solid fa-download"></i> 0</span>
                            </div>
                        </div>
                    </div>
                    <div class="hint" id="previewHint" style="font-size:0.85em; color:var(--gal-dim); margin-top:8px;"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="menu_button" data-close="publishMask">取消</button>
                <button class="menu_button primary" id="publishSubmit"><i class="fa-solid fa-cloud-arrow-up"></i> 发布</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="scripts/gallery.js"></script>
</body>
</html>
